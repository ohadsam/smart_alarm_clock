[versions]
agp                  = "8.4.2"
kotlin               = "2.0.0"
ksp                  = "2.0.0-1.0.22"
hilt                 = "2.51.1"
compose-bom          = "2024.06.00"
glance               = "1.1.0"
room                 = "2.6.1"
lifecycle            = "2.8.2"
coroutines           = "1.8.1"
navigation           = "2.7.7"
datastore            = "1.1.1"
work                 = "2.9.0"
core-ktx             = "1.13.1"
activity-compose     = "1.9.0"
junit                = "4.13.2"
robolectric          = "4.16.1"
mockk                = "1.14.2"
androidx-test-core   = "1.7.0"
androidx-test-junit  = "1.2.1"
androidx-test-runner = "1.6.2"
androidx-test-rules  = "1.6.1"
espresso             = "3.6.1"

[libraries]
androidx-core-ktx            = { group = "androidx.core",              name = "core-ktx",                    version.ref = "core-ktx" }
androidx-activity-compose    = { group = "androidx.activity",          name = "activity-compose",            version.ref = "activity-compose" }
compose-bom                  = { group = "androidx.compose",           name = "compose-bom",                 version.ref = "compose-bom" }
compose-ui                   = { group = "androidx.compose.ui",        name = "ui" }
compose-ui-graphics          = { group = "androidx.compose.ui",        name = "ui-graphics" }
compose-ui-tooling-preview   = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
compose-material3            = { group = "androidx.compose.material3", name = "material3" }
compose-ui-tooling           = { group = "androidx.compose.ui",        name = "ui-tooling" }
compose-material-icons       = { group = "androidx.compose.material",  name = "material-icons-extended" }
navigation-compose           = { group = "androidx.navigation",        name = "navigation-compose",          version.ref = "navigation" }
hilt-navigation-compose      = { group = "androidx.hilt",              name = "hilt-navigation-compose",     version = "1.2.0" }
lifecycle-viewmodel-compose  = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose    = { group = "androidx.lifecycle",         name = "lifecycle-runtime-compose",   version.ref = "lifecycle" }
hilt-android                 = { group = "com.google.dagger",          name = "hilt-android",                version.ref = "hilt" }
hilt-compiler                = { group = "com.google.dagger",          name = "hilt-android-compiler",       version.ref = "hilt" }
room-runtime                 = { group = "androidx.room",              name = "room-runtime",                version.ref = "room" }
room-ktx                     = { group = "androidx.room",              name = "room-ktx",                    version.ref = "room" }
room-compiler                = { group = "androidx.room",              name = "room-compiler",               version.ref = "room" }
glance-appwidget             = { group = "androidx.glance",            name = "glance-appwidget",            version.ref = "glance" }
glance-material3             = { group = "androidx.glance",            name = "glance-material3",            version.ref = "glance" }
coroutines-android           = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-android",  version.ref = "coroutines" }
datastore-preferences        = { group = "androidx.datastore",         name = "datastore-preferences",       version.ref = "datastore" }
work-runtime-ktx             = { group = "androidx.work",              name = "work-runtime-ktx",            version.ref = "work" }
hilt-work                    = { group = "androidx.hilt",              name = "hilt-work",                   version = "1.2.0" }
hilt-work-compiler           = { group = "androidx.hilt",              name = "hilt-compiler",               version = "1.2.0" }
junit                         = { group = "junit",                     name = "junit",                       version.ref = "junit" }
robolectric                   = { group = "org.robolectric",           name = "robolectric",                 version.ref = "robolectric" }
mockk                         = { group = "io.mockk",                  name = "mockk",                       version.ref = "mockk" }
coroutines-test               = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-test",     version.ref = "coroutines" }
androidx-test-core            = { group = "androidx.test",             name = "core",                        version.ref = "androidx-test-core" }
# ── Instrumented (emulator) tests ──────────────────────────────────
androidx-test-junit           = { group = "androidx.test.ext",         name = "junit",                       version.ref = "androidx-test-junit" }
androidx-test-runner          = { group = "androidx.test",             name = "runner",                      version.ref = "androidx-test-runner" }
androidx-test-rules           = { group = "androidx.test",             name = "rules",                       version.ref = "androidx-test-rules" }
espresso-core                 = { group = "androidx.test.espresso",    name = "espresso-core",               version.ref = "espresso" }
compose-ui-test-junit4        = { group = "androidx.compose.ui",       name = "ui-test-junit4" }
compose-ui-test-manifest      = { group = "androidx.compose.ui",       name = "ui-test-manifest" }
hilt-android-testing          = { group = "com.google.dagger",         name = "hilt-android-testing",        version.ref = "hilt" }

[plugins]
android-application = { id = "com.android.application",              version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",         version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin" }
hilt                = { id = "com.google.dagger.hilt.android",       version.ref = "hilt" }
ksp                 = { id = "com.google.devtools.ksp",              version.ref = "ksp" }
