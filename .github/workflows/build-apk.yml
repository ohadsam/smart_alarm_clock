name: Build SmartRing APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build SmartRing APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'          # built-in gradle cache

      # ── 3. Generate Gradle Wrapper ───────────────
      # Our repo ships gradlew + gradle-wrapper.properties but NOT the jar.
      # We install Gradle manually and regenerate the wrapper (jar + script).
      - name: Generate Gradle Wrapper
        run: |
          set -e
          GRADLE_VERSION="8.7"
          echo "Downloading Gradle ${GRADLE_VERSION}..."
          # Retry up to 3 times
          for i in 1 2 3; do
            wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
                 -O /tmp/gradle.zip && break
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
          unzip -q /tmp/gradle.zip -d /tmp/
          /tmp/gradle-${GRADLE_VERSION}/bin/gradle wrapper \
               --gradle-version ${GRADLE_VERSION} \
               --distribution-type bin
          chmod +x gradlew
          ls -la gradle/wrapper/

      # ── 4. Run unit tests ────────────────────────
      # JVM unit tests (plain + Robolectric, no real device/emulator) — the real
      # regression coverage for AlarmScheduler's recurrence math, ViewModels, and
      # Room DAO queries. Runs before assembling APKs so a broken test fails fast
      # instead of spending build time packaging an APK from code that doesn't work.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      # ── 4b. Upload test reports (always, even on failure) ─────────
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 30
          if-no-files-found: warn

      # ── 4c. Android Lint ─────────────────────────
      # Until v1.6.7 only lintVitalRelease ran (fatal issues only, as part of
      # assembleRelease), so error- and warning-severity checks — most of them — had
      # never seen this code. Errors fail; warnings are reported and don't (see the
      # lint{} block in app/build.gradle.kts for why).
      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      # The HTML report goes to an artifact, but artifact downloads aren't reachable
      # from every environment that needs to read this — so put the text report in the
      # log, where it always is. `always()` so a failing lint still shows what it found.
      - name: Show lint report
        if: always()
        run: cat app/build/reports/lint-results-debug.txt || echo "(no lint text report produced)"

      # ── 5. Build Debug APK ───────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      # ── 6. Upload Debug APK ──────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartRing-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # ── 7. Build Release APK ─────────────────────
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      # ── 8. Upload Release APK ────────────────────
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartRing-release-${{ github.run_number }}
          # release now has a real signingConfig (app/build.gradle.kts), so AGP
          # names the output app-release.apk (not -unsigned) and it installs as
          # an in-place update over any previous build signed with the same key.
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

      # ── Room's exported schemas ──────────────────
      # app/schemas/ is generated by KSP and is now committed, so a schema change shows
      # up as a reviewable diff like any other source change instead of being invisible
      # until it reaches a device. This fails when the build produces a schema that
      # differs from the committed one — which happens exactly when an @Entity was
      # edited: either the version was bumped and the regenerated JSON needs committing,
      # or it was not, and that is the bug Room would otherwise report for the first
      # time at runtime, on an upgrading user's phone, as a crash on launch.
      - name: Check Room schemas are committed and current
        run: |
          git add --intent-to-add app/schemas
          if ! git diff --exit-code -- app/schemas; then
            echo "::error::app/schemas is out of date (diff above). An @Entity changed: bump the version in AppDatabase.kt, add the Migration, and commit the regenerated JSON."
            exit 1
          fi
          echo "Committed Room schemas match the ones this build generated."

  # ── Instrumented tests on a real emulator ────────────────────────────
  # Separate job so it runs in parallel with the APK build rather than delaying it,
  # and so an emulator problem is immediately distinguishable from a build problem.
  # Covers what the JVM/Robolectric suite deliberately can't: the real AlarmManager
  # accepting an alarm-clock registration (which is what makes alarms Doze-exempt),
  # real SQLite, the real NotificationManager's channel settings, and the whole app
  # actually starting up and rendering through the real Hilt graph.
  instrumented:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Every SDK-gated path in this app had only ever run on one API level, so the
    # gates themselves were untested on a device: VibrationAttributes vs. the
    # AudioAttributes overload (33), canScheduleExactAlarms and Glance's cornerRadius
    # (31), foregroundServiceType=specialUse (34), and the runtime notification
    # permission (33). The JVM suite covers which branch is taken; only a real
    # emulator at that level covers whether the platform accepts the result.
    #
    # fail-fast: false so one level going red still reports the others — otherwise a
    # single flaky image hides real failures everywhere else.
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 30, 34]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate Gradle Wrapper
        run: |
          set -e
          GRADLE_VERSION="8.7"
          for i in 1 2 3; do
            wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
                 -O /tmp/gradle.zip && break
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
          unzip -q /tmp/gradle.zip -d /tmp/
          /tmp/gradle-${GRADLE_VERSION}/bin/gradle wrapper \
               --gradle-version ${GRADLE_VERSION} \
               --distribution-type bin
          chmod +x gradlew

      # The emulator needs hardware acceleration to be usable; GitHub's ubuntu
      # runners have KVM but not the group permissions to reach it by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 26 is minSdk (the oldest device this ships to), 30 the long-standing baseline,
      # 34 is targetSdk — the level whose new restrictions (notification permission,
      # foreground-service types) actually apply to this app in the store.
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # One command per line: this action runs the script line by line, each in
          # its own `sh -c`, so anything multi-line (an `if`, a loop) has to live in a
          # file. See scripts/release-smoke-test.sh.
          # Both steps are scripts for the same reason: no pipefail, no multi-line
          # constructs, and no way to react to a failure in a per-line `sh -c`.
          script: |
            ./scripts/instrumented-test.sh
            ./scripts/release-smoke-test.sh
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports-api${{ matrix.api-level }}-${{ github.run_number }}
          path: app/build/reports/androidTests/connected/
          retention-days: 30
          if-no-files-found: warn

      # Deliberately the LAST step in the job, and only on failure. Artifact downloads
      # are not reachable from every environment that has to read this, and the log
      # reader returns only the tail of a job — so a failure printed in the middle of a
      # 900-line log is a failure nobody can see. Putting the assertion text at the very
      # end is what makes a red emulator run diagnosable at all.
      - name: Show instrumented test failures
        if: failure()
        run: |
          echo "── which result files exist ──"
          find app/build/outputs/androidTest-results app/build/reports/androidTests -type f 2>/dev/null | head -40 || true
          echo "── failures and errors ──"
          grep -rhE -A 25 "<(failure|error)[ >]" \
            app/build/outputs/androidTest-results --include='*.xml' 2>/dev/null \
            | head -150 || echo "(no androidTest-results XML — the run died before any test reported)"
