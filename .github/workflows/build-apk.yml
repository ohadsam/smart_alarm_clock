name: Build SmartRing APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build SmartRing APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'          # built-in gradle cache

      # ── 3. Generate Gradle Wrapper ───────────────
      # Our repo ships gradlew + gradle-wrapper.properties but NOT the jar.
      # We install Gradle manually and regenerate the wrapper (jar + script).
      - name: Generate Gradle Wrapper
        run: |
          set -e
          GRADLE_VERSION="8.7"
          echo "Downloading Gradle ${GRADLE_VERSION}..."
          # Retry up to 3 times
          for i in 1 2 3; do
            wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
                 -O /tmp/gradle.zip && break
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
          unzip -q /tmp/gradle.zip -d /tmp/
          /tmp/gradle-${GRADLE_VERSION}/bin/gradle wrapper \
               --gradle-version ${GRADLE_VERSION} \
               --distribution-type bin
          chmod +x gradlew
          ls -la gradle/wrapper/

      # ── 4. Run unit tests ────────────────────────
      # JVM unit tests (plain + Robolectric, no real device/emulator) — the real
      # regression coverage for AlarmScheduler's recurrence math, ViewModels, and
      # Room DAO queries. Runs before assembling APKs so a broken test fails fast
      # instead of spending build time packaging an APK from code that doesn't work.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      # ── 4b. Upload test reports (always, even on failure) ─────────
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 30
          if-no-files-found: warn

      # ── 4c. Android Lint ─────────────────────────
      # Until v1.6.7 only lintVitalRelease ran (fatal issues only, as part of
      # assembleRelease), so error- and warning-severity checks — most of them — had
      # never seen this code. Errors fail; warnings are reported and don't (see the
      # lint{} block in app/build.gradle.kts for why).
      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      # The HTML report goes to an artifact, but artifact downloads aren't reachable
      # from every environment that needs to read this — so put the text report in the
      # log, where it always is. `always()` so a failing lint still shows what it found.
      - name: Show lint report
        if: always()
        run: cat app/build/reports/lint-results-debug.txt || echo "(no lint text report produced)"

      # ── 5. Build Debug APK ───────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      # ── 6. Upload Debug APK ──────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartRing-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      # ── 7. Build Release APK ─────────────────────
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      # ── 8. Upload Release APK ────────────────────
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartRing-release-${{ github.run_number }}
          # release now has a real signingConfig (app/build.gradle.kts), so AGP
          # names the output app-release.apk (not -unsigned) and it installs as
          # an in-place update over any previous build signed with the same key.
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

  # ── Instrumented tests on a real emulator ────────────────────────────
  # Separate job so it runs in parallel with the APK build rather than delaying it,
  # and so an emulator problem is immediately distinguishable from a build problem.
  # Covers what the JVM/Robolectric suite deliberately can't: the real AlarmManager
  # accepting an alarm-clock registration (which is what makes alarms Doze-exempt),
  # real SQLite, the real NotificationManager's channel settings, and the whole app
  # actually starting up and rendering through the real Hilt graph.
  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate Gradle Wrapper
        run: |
          set -e
          GRADLE_VERSION="8.7"
          for i in 1 2 3; do
            wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
                 -O /tmp/gradle.zip && break
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
          unzip -q /tmp/gradle.zip -d /tmp/
          /tmp/gradle-${GRADLE_VERSION}/bin/gradle wrapper \
               --gradle-version ${GRADLE_VERSION} \
               --distribution-type bin
          chmod +x gradlew

      # The emulator needs hardware acceleration to be usable; GitHub's ubuntu
      # runners have KVM but not the group permissions to reach it by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 30: new enough for everything these tests touch, old enough to avoid
      # Android 13's runtime notification-permission dialog and Android 14's
      # full-screen-intent grant appearing mid-test. The app's own SDK-gated code
      # paths for those are covered by the JVM suite instead.
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -e
            ./gradlew connectedDebugAndroidTest --stacktrace --no-daemon

            # The release APK is the one people actually install, and until v1.6.7
            # nothing ever ran it: minify and resource shrinking are both on, the
            # instrumented suite runs the *debug* build, and a missing R8 keep rule
            # shows up as a crash on launch that every other step here is blind to.
            # Launching it and checking the process is still alive exercises the whole
            # startup path through minified code — Hilt's graph, Room's generated
            # implementation, WorkManager's factory, Compose, DataStore.
            echo "── Release APK launch smoke test ──"
            ./gradlew assembleRelease --stacktrace --no-daemon
            adb logcat -c
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.smartring.app/com.smartring.app.MainActivity
            sleep 10
            if [ -z "$(adb shell pidof com.smartring.app | tr -d '[:space:]')" ]; then
              echo "::error::The minified release APK is not running 10s after launch — R8 or resource shrinking has stripped something the app needs at startup."
              adb logcat -d -b crash | tail -200
              exit 1
            fi
            echo "Release APK launched and still alive."
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports-${{ github.run_number }}
          path: app/build/reports/androidTests/connected/
          retention-days: 30
          if-no-files-found: warn
