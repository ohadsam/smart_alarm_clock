# Tests construct AlarmScheduler/ViewModels/DAOs directly with mocked/fake
# dependencies instead of going through Hilt's DI graph, so use the plain
# android.app.Application instead of the real @HiltAndroidApp SmartRingApp —
# otherwise every Robolectric test would trigger real Hilt injection (a real
# Room DB, WorkManager enqueue, the observeAlarms() background collector),
# which is both slow and unrelated to what these unit tests check.
application=android.app.Application
sdk=34
